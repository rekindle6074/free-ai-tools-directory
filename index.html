<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="OdVrrWzvAzmfuxZJxopa1XPww4RpksgzoCwdzDz9DGA" />
    <meta name="theme-color" content="#10b981" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>FreeAI Tools - Best Free AI Directory</title>
    <script>
      // Safe Tally loader
      window.onload = function() {
        const script = document.createElement('script');
        script.src = "https://tally.so/widgets/embed.js";
        script.async = true;
        document.head.appendChild(script);
      }
    </script>
    <script>
      // Automatically unregister any lingering service workers that might be causing hard-to-clear cache issues
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister().then(() => {
              console.log('ServiceWorker unregistered');
            });
          }
        });
      }

      // Utility to clear all application data if requested via URL
      if (window.location.search.includes('clear=true')) {
        localStorage.clear();
        sessionStorage.clear();
        if (window.indexedDB && window.indexedDB.databases) {
           window.indexedDB.databases().then(dbs => {
             dbs.forEach(db => window.indexedDB.deleteDatabase(db.name));
           });
        }
        window.location.href = window.location.pathname;
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
