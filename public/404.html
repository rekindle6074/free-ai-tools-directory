<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>404 - Page Not Found | FreeAI Tools Directory</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #0b0f17;
        color: #f1f5f9;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: rgba(30, 41, 59, 0.7);
        border: 1px solid rgba(51, 65, 85, 0.8);
        border-radius: 20px;
        padding: 48px 32px;
        max-width: 520px;
        width: 100%;
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(12px);
      }
      .badge {
        display: inline-block;
        padding: 6px 14px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #34d399;
        background: rgba(16, 185, 129, 0.12);
        border: 1px solid rgba(16, 185, 129, 0.25);
        border-radius: 9999px;
        margin-bottom: 20px;
      }
      .status-code {
        font-size: 72px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.03em;
        color: #10b981;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        color: #f8fafc;
        margin-bottom: 12px;
      }
      p {
        font-size: 15px;
        line-height: 1.6;
        color: #94a3b8;
        margin-bottom: 28px;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      @media (min-width: 480px) {
        .actions {
          flex-direction: row;
          justify-content: center;
        }
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 24px;
        font-size: 14px;
        font-weight: 600;
        border-radius: 12px;
        text-decoration: none;
        transition: all 0.2s ease;
      }
      .btn-primary {
        background-color: #10b981;
        color: #042f2e;
      }
      .btn-primary:hover {
        background-color: #059669;
        color: #ffffff;
      }
      .btn-secondary {
        background-color: rgba(51, 65, 85, 0.5);
        color: #e2e8f0;
        border: 1px solid rgba(71, 85, 105, 0.6);
      }
      .btn-secondary:hover {
        background-color: rgba(71, 85, 105, 0.8);
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">Error 404</span>
      <div class="status-code">404</div>
      <h1>Page Not Found</h1>
      <p>The page, tool, or category you requested does not exist, has been removed, or is temporarily unavailable.</p>
      <div class="actions">
        <a href="/" class="btn btn-primary">Back to Home</a>
        <a href="/browse" class="btn btn-secondary">Browse All Tools</a>
      </div>
    </main>
  </body>
</html>
