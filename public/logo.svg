<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Circle Ring Gradient -->
    <linearGradient id="freeai-gradRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#081e11" />
      <stop offset="50%" stop-color="#145a32" />
      <stop offset="100%" stop-color="#2ba462" />
    </linearGradient>

    <!-- Bottom Stem/Fold Gradient -->
    <linearGradient id="freeai-gradBottom" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#081e11" />
      <stop offset="45%" stop-color="#0e3a21" />
      <stop offset="80%" stop-color="#166534" />
      <stop offset="100%" stop-color="#2ba462" />
    </linearGradient>

    <!-- Middle Segment Gradient: sweeping crossbar and 3D twist -->
    <linearGradient id="freeai-gradMiddle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ba462" />
      <stop offset="35%" stop-color="#19653a" />
      <stop offset="70%" stop-color="#0f4425" />
      <stop offset="100%" stop-color="#081e11" />
    </linearGradient>

    <!-- Top Segment Gradient: upper loop arch -->
    <linearGradient id="freeai-gradTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b301a" />
      <stop offset="30%" stop-color="#166534" />
      <stop offset="75%" stop-color="#2ba462" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Highlight Sheen Gradient -->
    <linearGradient id="freeai-gradHighlight" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#34d399" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>

    <!-- Inner Hollow Gradient -->
    <linearGradient id="freeai-gradInner" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#04120a" />
      <stop offset="60%" stop-color="#081e11" />
      <stop offset="100%" stop-color="#103a22" />
    </linearGradient>

    <!-- Baked ambient shadow under middle fold -->
    <linearGradient id="freeai-bakedShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Outer Framing Ring -->
  <circle cx="256" cy="256" r="156" stroke="url(#freeai-gradRing)" stroke-width="15" />

  <!-- 3D "F" Ribbon Group -->
  <g id="freeai-ribbonF">
    <!-- 1. Baked Shadow under bottom curl -->
    <path d="M 175 360 C 165 385 180 415 210 422 C 240 428 260 410 255 385 C 240 370 200 350 175 360 Z" fill="url(#freeai-bakedShadow)" opacity="0.6" />

    <!-- 2. Inner Cavity / Back Wall of Upper Loop -->
    <path d="M 215 240 C 205 185 235 152 285 152 C 330 152 358 178 352 215 C 345 250 310 262 270 266 C 245 268 225 258 215 240 Z" fill="url(#freeai-gradInner)" />

    <!-- 3. Bottom Curl / Stem (Layer 1) -->
    <path d="M 182 320 C 172 355 168 385 188 408 C 205 426 235 426 250 405 C 262 388 260 365 248 340 C 235 320 215 310 182 320 Z" fill="url(#freeai-gradBottom)" />
    <!-- Bottom Curl Inner Rim -->
    <path d="M 195 345 C 190 368 198 392 215 402 C 230 410 245 398 248 385 C 252 368 238 345 220 338 C 208 335 200 338 195 345 Z" fill="#06180e" />

    <!-- 4. Baked Shadow cast on inner spine by top loop fold -->
    <path d="M 230 220 C 245 240 280 255 315 250 C 330 248 348 240 352 230 C 345 250 320 265 285 268 C 255 270 235 255 230 220 Z" fill="url(#freeai-bakedShadow)" opacity="0.7" />

    <!-- 5. Top Loop Arch (Layer 2) -->
    <path d="M 172 250 C 172 178 220 132 290 132 C 342 132 380 168 376 220 C 372 265 330 288 280 288 C 235 288 200 270 190 245 C 198 260 225 272 265 272 C 310 272 352 250 356 215 C 360 178 330 152 288 152 C 238 152 195 185 195 245 C 195 255 190 260 172 250 Z" fill="url(#freeai-gradTop)" />

    <!-- 6. Main Sweeping Crossbar & Front Twist (Layer 3 - The prominent "F" stroke) -->
    <path d="M 175 372 C 160 345 168 305 192 270 C 215 235 260 215 310 205 C 355 195 385 205 380 230 C 375 255 340 272 290 288 C 230 308 195 338 175 372 Z" fill="url(#freeai-gradMiddle)" />

    <!-- 7. Specular 3D Highlight Rib along the sweeping ridge of the crossbar -->
    <path d="M 178 360 C 195 328 230 300 285 282 C 335 266 368 250 376 230 C 372 235 345 252 295 270 C 245 288 205 318 178 360 Z" fill="url(#freeai-gradHighlight)" />
    <!-- Top crest subtle rim highlight -->
    <path d="M 225 142 C 260 134 305 136 345 152 C 362 160 372 172 376 188 C 373 175 360 160 340 150 C 300 135 258 135 225 142 Z" fill="#6ee7b7" opacity="0.65" />
  </g>
</svg>