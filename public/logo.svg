<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background drop shadow for a modern 3D depth effect -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.10" />
    </filter>

    <!-- Bottom Segment Gradient (dark corner transitioning to vibrant emerald) -->
    <linearGradient id="gradBottom" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#114327" />
      <stop offset="50%" stop-color="#19653a" />
      <stop offset="100%" stop-color="#2ba462" />
    </linearGradient>

    <!-- Middle Segment Gradient (dark shade under top fold, to vibrant over bottom fold) -->
    <linearGradient id="gradMiddle" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#081e11" />
      <stop offset="15%" stop-color="#0e3a21" />
      <stop offset="60%" stop-color="#175d35" />
      <stop offset="100%" stop-color="#2ba462" />
    </linearGradient>

    <!-- Top Segment Gradient (medium-vibrant on left to bright emerald on right) -->
    <linearGradient id="gradTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a6d3f" />
      <stop offset="50%" stop-color="#1e7a46" />
      <stop offset="100%" stop-color="#2ba462" />
    </linearGradient>

    <!-- Shadow cast by Middle Segment fold on Bottom Segment near (132, 382) -->
    <linearGradient id="shadowOnBottom" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#04120a" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#114327" stop-opacity="0" />
    </linearGradient>

    <!-- Shadow cast by Top Segment fold on Middle Segment near (380, 130) -->
    <linearGradient id="shadowOnMiddle" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#04120a" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#175d35" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Soft circular background shield with drop shadow filter -->
  <circle cx="256" cy="256" r="148" fill="#ECECEC" filter="url(#drop-shadow)" />

  <!-- S-Ribbon Layer 1: Bottom Segment stroke -->
  <path d="M 132,382 L 372,272" stroke="url(#gradBottom)" stroke-width="96" stroke-linecap="round" />

  <!-- S-Ribbon Layer 2: Shadow overlay on Bottom Segment near the fold -->
  <path d="M 132,382 L 205,348" stroke="url(#shadowOnBottom)" stroke-width="96" stroke-linecap="round" />

  <!-- S-Ribbon Layer 3: Middle Segment stroke -->
  <path d="M 380,130 L 132,382" stroke="url(#gradMiddle)" stroke-width="96" stroke-linecap="round" />

  <!-- S-Ribbon Layer 4: Shadow overlay on Middle Segment near the upper fold -->
  <path d="M 380,130 L 310,200" stroke="url(#shadowOnMiddle)" stroke-width="96" stroke-linecap="round" />

  <!-- S-Ribbon Layer 5: Top Segment stroke -->
  <path d="M 140,240 L 380,130" stroke="url(#gradTop)" stroke-width="96" stroke-linecap="round" />
</svg>
